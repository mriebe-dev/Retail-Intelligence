<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { 
      width: 1280px; 
      min-height: 720px; 
      background: #F9F6F0; 
      display: flex; 
      flex-direction: column; 
      padding: 48px;
      position: relative;
    }
    .motif {
      position: absolute;
      top: 48px;
      right: 48px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: #1C1B1A;
      font-weight: 400;
    }
    .footer {
      position: absolute;
      bottom: 48px;
      left: 48px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: #85827D;
      text-transform: uppercase;
    }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-top: 100px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 72px;
      line-height: 1.1;
      color: #1C1B1A;
      max-width: 900px;
      margin-bottom: 32px;
    }
    .divider {
      width: 120px;
      height: 4px;
      background: #B87333;
      margin-bottom: 40px;
    }
    .summary {
      font-family: 'Inter', sans-serif;
      font-size: 24px;
      color: #4A4846;
      max-width: 700px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="motif">THE LOCATION GROUP</div>
    <div class="content">
      <h1>Global Store Openings — Management Overview</h1>
      <div class="divider"></div>
      <p class="summary">
        Analyse von 252 Retail-Neueröffnungen im Zeitraum Q3/Q4 2026. 
        Schwerpunkte auf strategisches Momentum, geografische Konzentration 
        und Datenqualität für das Management.
      </p>
    </div>
    <div class="footer">Source: Global Luxury Monitoring Portal · Oct 2026</div>
  </div>
</body>
</html>
