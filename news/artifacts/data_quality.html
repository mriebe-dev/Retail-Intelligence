<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { 
      width: 1280px; 
      min-height: 720px; 
      background: #F9F6F0; 
      display: flex; 
      flex-direction: column; 
      padding: 48px;
      position: relative;
    }
    .motif {
      position: absolute;
      top: 48px;
      right: 48px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: #1C1B1A;
    }
    .footer {
      position: absolute;
      bottom: 48px;
      left: 48px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: #85827D;
      text-transform: uppercase;
    }
    h2 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      color: #1C1B1A;
      margin-bottom: 48px;
      margin-top: 24px;
    }
    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      flex: 1;
    }
    .chart-container {
      height: 400px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .stats-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Inter', sans-serif;
    }
    .stats-table th {
      text-align: left;
      padding: 12px 0;
      border-bottom: 1px solid #1C1B1A;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #1C1B1A;
    }
    .stats-table td {
      padding: 16px 0;
      border-bottom: 1px solid #DCD8CF;
      font-size: 16px;
      color: #4A4846;
    }
    .stats-table tr:last-child td {
      border-bottom: none;
    }
    .value {
      font-weight: 700;
      color: #B87333;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="motif">THE LOCATION GROUP</div>
    <h2>Datenbasis & Verifizierungsgrad</h2>
    <div class="content-grid">
      <div class="chart-container">
        <canvas id="qualityChart"></canvas>
      </div>
      <div>
        <table class="stats-table">
          <thead>
            <tr>
              <th>Datenfeld</th>
              <th class="value">Abdeckung</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Gesamtanzahl Openings</td>
              <td class="value">252</td>
            </tr>
            <tr>
              <td>Mit Foto-Referenz</td>
              <td class="value">127 (50.4%)</td>
            </tr>
            <tr>
              <td>Mit GPS-Koordinaten</td>
              <td class="value">139 (55.2%)</td>
            </tr>
            <tr>
              <td>Hausnummern-Präzision</td>
              <td class="value">12 (4.8%)</td>
            </tr>
            <tr>
              <td>Flächenangaben (m²)</td>
              <td class="value">8 (3.2%)</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="footer">Data Snapshot: Oct 2026 · Source: CPP, FashionUnited, LinkedIn</div>
    <script>
      const ctx = document.getElementById('qualityChart').getContext('2d');
      new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Mit Foto', 'Ohne Foto'],
          datasets: [{
            data: [127, 125],
            backgroundColor: ['#B87333', '#EDE9DF'],
            borderWidth: 0
          }]
        },
        options: {
          animation: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                font: { family: 'Inter', size: 14 },
                color: '#1C1B1A',
                padding: 20
              }
            },
            title: {
              display: true,
              text: 'Visuelle Abdeckung (Fotos)',
              font: { family: 'Playfair Display', size: 20 },
              color: '#1C1B1A',
              padding: { bottom: 20 }
            }
          },
          cutout: '70%'
        }
      });
    </script>
  </div>
</body>
</html>
