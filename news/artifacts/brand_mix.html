<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { 
      width: 1280px; 
      min-height: 720px; 
      background: #F9F6F0; 
      display: flex; 
      flex-direction: column; 
      padding: 48px;
      position: relative;
    }
    .motif {
      position: absolute;
      top: 48px;
      right: 48px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: #1C1B1A;
    }
    .footer {
      position: absolute;
      bottom: 48px;
      left: 48px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: #85827D;
      text-transform: uppercase;
    }
    h2 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      color: #1C1B1A;
      margin-bottom: 48px;
      margin-top: 24px;
    }
    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      flex: 1;
    }
    .brand-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Inter', sans-serif;
    }
    .brand-table th {
      text-align: left;
      padding: 12px 0;
      border-bottom: 1px solid #1C1B1A;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .brand-table td {
      padding: 12px 0;
      border-bottom: 1px solid #DCD8CF;
      font-size: 15px;
      color: #4A4846;
    }
    .brand-count {
      text-align: right;
      font-weight: 700;
      color: #B87333;
    }
    .chart-box {
      height: 350px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="motif">THE LOCATION GROUP</div>
    <h2>Marken- und Kategorieprofil</h2>
    <div class="content-grid">
      <div>
        <table class="brand-table">
          <thead>
            <tr>
              <th>Top-Marken (Expansion)</th>
              <th class="brand-count">Units</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>Cartier</td><td class="brand-count">14</td></tr>
            <tr><td>Dior / Rolex / Patek Philippe</td><td class="brand-count">12</td></tr>
            <tr><td>Chanel / Gucci / Hermès</td><td class="brand-count">11</td></tr>
            <tr><td>Prada / Bulgari / Fendi</td><td class="brand-count">11</td></tr>
            <tr><td>Omega</td><td class="brand-count">11</td></tr>
          </tbody>
        </table>
      </div>
      <div>
        <div class="chart-box">
          <canvas id="categoryChart"></canvas>
        </div>
      </div>
    </div>
    <div class="footer">Source: Brand Analytics Oct 2026 · Categories: N=252</div>
    <script>
      const ctx = document.getElementById('categoryChart').getContext('2d');
      new Chart(ctx, {
        type: 'pie',
        data: {
          labels: ['Fashion', 'Watches', 'Jewelry'],
          datasets: [{
            data: [195, 34, 23],
            backgroundColor: ['#1C1B1A', '#B87333', '#85827D'],
            borderWidth: 0
          }]
        },
        options: {
          animation: false,
          plugins: {
            legend: {
              position: 'right',
              labels: { font: { family: 'Inter', size: 14 }, color: '#1C1B1A' }
            },
            title: {
              display: true,
              text: 'Kategorien-Verteilung',
              font: { family: 'Playfair Display', size: 20 },
              color: '#1C1B1A'
            }
          }
        }
      });
    </script>
  </div>
</body>
</html>
